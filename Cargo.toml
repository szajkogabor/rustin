[package]
name = "rustin"
edition = "2024"
authors = ["Gabor Szajko <szajkogabor@gmail.com>"]
description = "A fast, modern, cross-platform to-do list manager written in Rust."
license = "MIT"
repository = "https://github.com/szajkogabor/rustin"
keywords = ["cli", "todo", "kanban", "productivity"]
categories = ["development-tools::cli-utils"]
version = "1.0.1"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap-verbosity-flag = { version = "3", features = ["tracing"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", features = ["macros", "formatting"] }
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }
console = "0.16.6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[build-dependencies]
anyhow = "1"
vergen = { version = "10", features = ["build"] }
vergen-git2 = "10"
